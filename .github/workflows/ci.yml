name: BMAD Suite CI & Security Gate

on:
  push:
    branches: [main]
    tags: ['v4.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-audit:
    name: Configuration Contracts and Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML Dependency
        run: timeout 600s python3 -m pip install --no-input 'PyYAML==6.0.1' < /dev/null

      - name: Shell Syntax and Diff Verification
        run: |
          timeout 15s bash -n bs.sh < /dev/null
          timeout 15s bash -n install.sh < /dev/null
          timeout 15s git --no-pager diff --check < /dev/null

      - name: Validate Plugin JSON Structure
        run: |
          timeout 30s python3 -c '
          import json, pathlib
          files = sorted(pathlib.Path(".").glob("**/plugin.json"))
          if not files:
              raise SystemExit("No plugin.json found")
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or not isinstance(data.get("name"), str):
                  raise SystemExit(f"Invalid plugin structure: {path}")
              print(f"Valid plugin JSON: {path}")
          ' < /dev/null

      - name: Validate Two-Segment Release and Source Consistency
        shell: bash
        run: |
          set -euo pipefail
          args=(--root .)
          if [[ "${GITHUB_REF_TYPE:-}" = tag ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          timeout --kill-after=2s 30s python3 -B scripts/release_version.py "${args[@]}" < /dev/null

      - name: Test Release Version Contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/roo_distribution/test_release_versions.py
          timeout --kill-after=2s 30s python3 -B -c '
          import sys, unittest
          suite = unittest.defaultTestLoader.discover(
              "tests/roo_distribution", pattern="test_release_versions.py",
          )
          if suite.countTestCases() == 0:
              raise SystemExit("Missing required regression test cases")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          ' < /dev/null

      - name: Validate Self-Contained Skill Assets
        run: timeout --kill-after=2s 30s python3 -B bmad-suite-v4/skills/bmad/scripts/validate-solo-package.py < /dev/null

      - name: Validate V4 Configuration and Metadata Contracts
        run: |
          set -euo pipefail
          timeout 30s python3 -B scripts/validate-roo-contracts.py --suite v4 < /dev/null

      - name: Test Configuration Contracts
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 30s python3 -B scripts/run-required-tests.py --directory tests/roo_contracts --pattern 'test_*.py' < /dev/null

  test-physical-mirror-install:
    name: Isolated Asset Safety and GitOps Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML Dependency
        run: timeout 600s python3 -m pip install --no-input 'PyYAML==6.0.1' < /dev/null

      - name: Test Asset Protection in Bounded Sequential Groups
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          groups=(tests/roo_distribution/test_asset_safety*.py)
          if [ "${#groups[@]}" -eq 0 ]; then
            printf '%s\n' 'Missing asset safety tests' >&2
            exit 1
          fi
          for group in "${groups[@]}"; do
            timeout --kill-after=2s 30s python3 -B scripts/run-required-tests.py --directory tests/roo_distribution --pattern "${group##*/}" < /dev/null
          done

      - name: Test GitOps and Three IDE Layouts in Bounded Sequential Groups
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          groups=(tests/roo_distribution/test_gitops*.py)
          if [ "${#groups[@]}" -eq 0 ]; then
            printf '%s\n' 'Missing GitOps tests' >&2
            exit 1
          fi
          for group in "${groups[@]}"; do
            timeout --kill-after=2s 30s python3 -B scripts/run-required-tests.py --directory tests/roo_distribution --pattern "${group##*/}" < /dev/null
          done

      - name: Test Suite Selection and Compatibility in Bounded Sequential Groups
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          groups=(tests/roo_distribution/test_suite*.py)
          if [ "${#groups[@]}" -eq 0 ]; then
            printf '%s\n' 'Missing suite compatibility tests' >&2
            exit 1
          fi
          for group in "${groups[@]}"; do
            timeout --kill-after=2s 30s python3 -B scripts/run-required-tests.py --directory tests/roo_distribution --pattern "${group##*/}" < /dev/null
          done

      - name: Test Deployment Guards in Bounded Sequential Groups
        shell: bash
        run: |
          set -euo pipefail
          for group in test_version_guard.py test_task_cleanup_guard.py; do
            test -f "tests/roo_distribution/$group"
            timeout --kill-after=2s 30s python3 -B scripts/run-required-tests.py --directory tests/roo_distribution --pattern "$group" < /dev/null
          done

      - name: Test Retired Deployment Migration in Isolation
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/roo_distribution/test_retired_deployment_migration.py
          cases=$(timeout --kill-after=2s 15s python3 -B -c '
          import unittest
          suite = unittest.defaultTestLoader.discover(
              "tests/roo_distribution", pattern="test_retired_deployment_migration.py",
          )
          if suite.countTestCases() == 0:
              raise SystemExit("Missing retired deployment migration test cases")
          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item.id()
          cases = list(flatten(suite))
          if len(cases) != suite.countTestCases() or len(set(cases)) != len(cases):
              raise SystemExit("Invalid retired deployment migration collection")
          print("\n".join(cases))
          ' < /dev/null)
          while IFS= read -r case; do
            timeout --kill-after=2s 30s python3 -B -c '
          import sys, unittest
          sys.path.insert(0, "tests/roo_distribution")
          suite = unittest.defaultTestLoader.loadTestsFromName(sys.argv[1])
          if suite.countTestCases() != 1:
              raise SystemExit("Expected exactly one collected migration case")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          ' "$case" < /dev/null
          done <<< "$cases"

      - name: Test Skill Integrity and Source Boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/roo_distribution/test_skill_integrity.py
          timeout --kill-after=2s 30s python3 -B -c '
          import sys, unittest
          suite = unittest.defaultTestLoader.discover(
              "tests/roo_distribution", pattern="test_skill_integrity.py",
          )
          if suite.countTestCases() == 0:
              raise SystemExit("Missing skill integrity test cases")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          ' < /dev/null

      - name: Test Cline Skills and Installation in Bounded Sequential Groups
        shell: bash
        run: |
          set -euo pipefail
          for group in test_cline_skill_assets.py test_cline_distribution.py test_cline_installer.py; do
            test -f "tests/roo_distribution/$group"
            timeout --kill-after=2s 30s python3 -B -c '
          import sys, unittest
          suite = unittest.defaultTestLoader.discover(
              "tests/roo_distribution", pattern=sys.argv[1],
          )
          if suite.countTestCases() == 0:
              raise SystemExit("Missing Cline regression test cases")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          ' "$group" < /dev/null
          done

      - name: Test Installation Dependency Preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/roo_distribution/test_install_dependencies.py
          timeout --kill-after=2s 30s python3 -B -c '
          import sys, unittest
          suite = unittest.defaultTestLoader.discover(
              "tests/roo_distribution", pattern="test_install_dependencies.py",
          )
          if suite.countTestCases() == 0:
              raise SystemExit("Missing required regression test cases")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          ' < /dev/null

      - name: Test Deployed Rule Link Contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/roo_distribution/test_deployed_rule_links.py
          timeout --kill-after=2s 30s python3 -B -c '
          import sys, unittest
          suite = unittest.defaultTestLoader.discover(
              "tests/roo_distribution", pattern="test_deployed_rule_links.py",
          )
          if suite.countTestCases() == 0:
              raise SystemExit("Missing required regression test cases")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          ' < /dev/null

      - name: Test Portable Governance Contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/roo_distribution/test_portable_governance.py
          timeout --kill-after=2s 30s python3 -B -c '
          import sys, unittest
          suite = unittest.defaultTestLoader.discover(
              "tests/roo_distribution", pattern="test_portable_governance.py",
          )
          if suite.countTestCases() == 0:
              raise SystemExit("Missing required regression test cases")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          ' < /dev/null

      - name: Test V4 Analysis Repair Distribution
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 30s python3 -B scripts/run-required-tests.py --directory tests/roo_distribution --pattern 'test_v4_analysis_distribution.py' < /dev/null

      - name: State Verification Boundary
        run: printf '%s\n' 'Isolated disk-asset tests do not verify Roo runtime loading or permission enforcement.'

  test-win10-iex-entry:
    name: Windows PowerShell 5.1 Direct IEX Contract
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test BOM-Free Candidate and Direct IEX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows_cline\test_iex_entry.ps1

      - name: Test Published Commit HTTP Text and Direct IEX
        if: github.event_name == 'push'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://raw.githubusercontent.com/' + $env:GITHUB_REPOSITORY + '/' + $env:GITHUB_SHA + '/install-win10.ps1'
          & .\tests\windows_cline\test_iex_entry.ps1 -Uri $uri
