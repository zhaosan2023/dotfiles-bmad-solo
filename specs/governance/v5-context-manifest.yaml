schema_version: "2.0"
bundle_version: 2
description: "BMAD-Solo V5.1 纯 Vibe 文档关联清单（独立 XDG 受管核心、Cline 单一薄入口、零工具名与零工作区注入）"

# 1. 受管核心与上下文来源定义 (Sources)
sources:
  - id: v5_global_router
    authority: required
    type: static_thin_router
    description: "BMAD-Solo V5.1 极简全局薄路由（Plan/Act 模式分流与权限底线）"
    distribution: "managed_file"
    target_path: "~/.cline/rules/bmad-v5-router.md"
    mode: "0644" # 允许 Cline UI 切换 disabled frontmatter

  - id: v5_skill_ana_solo
    authority: required
    type: managed_skill_readonly
    description: "Plan 阶段方法论：三遍阅读、证据分层、DM/DR 与文档治理结晶（不碰代码）"
    distribution: "managed_file"
    target_path: "~/.local/share/bmad-solo/v5/skills/ana-solo.md"
    mode: "0444" # 宿主非自动发现目录，只读防误改

  - id: v5_skill_bmad_solo
    authority: required
    type: managed_skill_readonly
    description: "Act 阶段方法论：获准工程实施、五条不变量、场景背压与真实回执"
    distribution: "managed_file"
    target_path: "~/.local/share/bmad-solo/v5/skills/bmad-solo.md"
    mode: "0444"

  - id: project_baseline
    authority: optional_workspace
    type: workspace_file
    path_pattern: "docs/project-context.md"
    on_missing: "DEGRADED_INFO"

  - id: active_task_pointer
    authority: optional_conditional
    type: workspace_file
    path_pattern: "specs/tasks/_active.md"
    on_missing: "SKIP_FOR_NON_BMAD_REPO" # 普通不含 specs/tasks/ 的业务仓库不误阻塞
    conflict_resolution: "SINGLE_ACTIVE_TASK_ONLY"

  - id: approved_plan
    authority: required_when_pointer_active
    type: workspace_file
    path_pattern: "specs/tasks/TU-*.md"
    selection_rule: "match_active_task_pointer"
    validation_rule:
      required_fields: ["task_id", "status", "cs_specification"]
      status_allowed: ["APPROVED", "READY", "IN_PROGRESS", "COMPLETED", "AUDIT_READY"]
      require_non_expired_evidence: true
    on_missing: "BLOCK_AND_REPORT"

# 2. 纯 Vibe 路径边界声明（零工具名、零底层协议干预）
path_boundaries:
  tool_negotiation_policy: "host_and_model_autonomous"
  workspace_rule_injection_default: false # V5.1 默认绝不向业务仓库注入 .cline/rules/
  isolated_forbidden_roots:
    - "~/.gemini/" # 物理冻结 Antigravity-Gemini V4 生产资产，V5 严禁触碰
  read_scope:
    policy: "linux_current_user_specified_paths"
    note: "允许按需读取当前 Linux $USER 权限可访问的任意指定路径，不绕过客户端实际审批或沙箱限制"
  plan_crystallization_write_paths:
    - "docs/analysis/ANALYSIS-YYYYMMDD-<topic>.md"
    - "docs/adrs/ADR-YYYYMMDD-<topic>.md"
    - "specs/tasks/TU-<task_id>.md"
  self_rule_mutation_forbidden:
    - ".clinerules"
    - ".cline/rules/"
    - "~/.cline/rules/"
    - "~/.local/share/bmad-solo/"

# 3. 阶段职责路由 (Flows)
flows:
  analysis:
    mode_signal: "PLAN"
    thin_link_target: "~/.local/share/bmad-solo/v5/skills/ana-solo.md"
    may_write_code: false
    may_run_terminal: false
    may_produce_when_authorized:
      - "docs/analysis/ANALYSIS-YYYYMMDD-<topic>.md"
      - "docs/adrs/ADR-YYYYMMDD-<topic>.md"
      - "specs/tasks/TU-<task_id>.md"
    on_host_write_unavailable: "DELIVER_FULL_TEXT_IN_SESSION_HONESTLY"
    exit_gate:
      require_user_approval: true

  implementation:
    mode_signal: "ACT"
    thin_link_target: "~/.local/share/bmad-solo/v5/skills/bmad-solo.md"
    may_write_code: true
    may_run_terminal: true
    preflight_scope: "only_when_specs_tasks_active_exists"
    backpressure_policy:
      max_consecutive_same_root_failures: 2
      verification_type_routing:
        code_tasks: "require_real_non_interactive_receipt"
        doc_governance_tasks: "require_diff_cleanliness_and_schema_pass"
    on_required_gate_failure: "BLOCKED"
